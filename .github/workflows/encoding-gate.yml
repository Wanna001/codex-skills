name: encoding-gate

on:
  push:
    branches: [master]
  pull_request:

jobs:
  script-encoding:
    name: Script encoding gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check script encodings
        shell: pwsh
        run: |
          ./skills/windows-cjk-script-encoding/scripts/normalize-script-encoding.ps1 -Path . -Recurse -Check -Verbose
